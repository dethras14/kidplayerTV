name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip openjdk-17-jdk
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          build-tools-version: 33.0.0
          accept-android-sdk-licenses: true
      - name: Install Buildozer and Cython
        run: |
          pip install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Configure buildozer.spec
        run: |
          # Remove any existing sdk_path line (it will be overridden by ANDROID_HOME)
          sed -i '/^android.sdk_path/d' buildozer.spec
          # Keep NDK, build_tools, ignore_root
          sed -i '/^android.ndk/d' buildozer.spec
          sed -i '/^android.build_tools/d' buildozer.spec
          sed -i '/^android.ignore_root/d' buildozer.spec
          echo "android.ndk = 25c" >> buildozer.spec
          echo "android.build_tools = 33.0.0" >> buildozer.spec
          echo "android.ignore_root = 1" >> buildozer.spec
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk   # Path set by setup-android
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kidplayer-apk
          path: bin/*.apk
