name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip openjdk-17-jdk
          pip install --user buildozer cython
          export PATH=$HOME/.local/bin:$PATH
          # Use existing buildozer.spec, ensure NDK and ignore_root
          sed -i '/^android.ndk/d' buildozer.spec
          echo "android.ndk = 25c" >> buildozer.spec
          sed -i '/^android.ignore_root/d' buildozer.spec
          echo "android.ignore_root = 1" >> buildozer.spec
      - name: Install Android SDK build-tools
        run: |
          export PATH=$HOME/.local/bin:$PATH
          # Buildozer will have downloaded the SDK if not present; but we need to install build-tools
          # Accept licenses and install build-tools 33.0.0
          yes | sdkmanager --licenses
          sdkmanager "build-tools;33.0.0"
        env:
          ANDROID_HOME: $HOME/.buildozer/android/platform/android-sdk
      - name: Build APK
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kidplayer-apk
          path: bin/*.apk
