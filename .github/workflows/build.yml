name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip openjdk-17-jdk
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          build-tools-version: 33.0.0
          accept-android-sdk-licenses: true
      - name: Install Buildozer
        run: |
          pip install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Configure Buildozer to use the pre-installed SDK
        run: |
          # Remove Buildozer's own SDK (if any)
          rm -rf ~/.buildozer/android/platform/android-sdk
          # Create a symlink from Buildozer's expected path to the actual SDK
          mkdir -p ~/.buildozer/android/platform
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          # Set spec to use the same path (optional but safe)
          sed -i '/^android.sdk_path/d' buildozer.spec
          echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec
          # Force NDK 25c and ignore root
          sed -i '/^android.ndk/d' buildozer.spec
          echo "android.ndk = 25c" >> buildozer.spec
          sed -i '/^android.ignore_root/d' buildozer.spec
          echo "android.ignore_root = 1" >> buildozer.spec
          # Force build-tools 33 (though already installed)
          sed -i '/^android.build_tools/d' buildozer.spec
          echo "android.build_tools = 33.0.0" >> buildozer.spec
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kidplayer-apk
          path: bin/*.apk
