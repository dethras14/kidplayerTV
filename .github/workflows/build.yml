name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git zip unzip openjdk-17-jdk
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          build-tools-version: 33.0.0
          accept-android-sdk-licenses: true
      - name: Install Buildozer and Cython
        run: |
          pip install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Configure buildozer.spec
        run: |
          # Remove any existing SDK or NDK lines
          sed -i '/^android.sdk_path/d' buildozer.spec
          sed -i '/^android.ndk/d' buildozer.spec
          sed -i '/^android.build_tools/d' buildozer.spec
          sed -i '/^android.ignore_root/d' buildozer.spec
          sed -i '/^android.accept_sdk_license/d' buildozer.spec
          # Force SDK to the action-installed path
          echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec
          # Force NDK 25c (Buildozer will download it)
          echo "android.ndk = 25c" >> buildozer.spec
          # Build-tools version (already installed by action)
          echo "android.build_tools = 33.0.0" >> buildozer.spec
          # Ignore root warning
          echo "android.ignore_root = 1" >> buildozer.spec
          # Auto-accept SDK license (just in case)
          echo "android.accept_sdk_license = True" >> buildozer.spec
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk   # Override default path
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kidplayer-apk
          path: bin/*.apk
